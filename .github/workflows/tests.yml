
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with diagnostics
        timeout-minutes: 2
        run: |
          python -u -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(30, repeat=True); unittest.main(module=None, argv=['unittest', 'discover', '-v'])"
